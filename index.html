
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yummi Logo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #fef8fd;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.logo {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: rotate(-5deg);
}

.logo-text {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 150px;
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -0.075em;
    line-height: 0.95;
    white-space: nowrap;
    color: #0d0109;
    text-align: center;
}

.underline {
    position: relative;
    width: 30%;
    height: 20px;
    left: 21px;
    bottom: 9px;
    margin-top: 1px;

    background: #eb1515;

    transform: skewX(4deg);
    border-radius: 0;
}

/* TABLET */
@media (min-width: 601px) and (max-width: 900px) {
    .logo-text {
        font-size: 120px;
    }

    .underline {
        width: 35%;
        height: 16px;
        left: 20px;
        bottom: 9px;
    }
}

/* MOBILE */
@media (max-width: 600px) {
    .logo {
        width: 100%;
        transform: rotate(-5deg);
    }

    .logo-text {
        font-size: 26vw;
        letter-spacing: -0.075em;
        line-height: 0.95;
    }

    .underline {
       width: 78%;
        height: 3vw;
        max-height: 18px;
        min-height: 8px;
        left: 4vw;
        bottom: 1.5vw;
        margin-top: 0;
    }
}

/* SMALL MOBILE */
@media (max-width: 360px) {
    .logo-text {
        font-size: 25vw;
    }

    .underline {
        width: 38%;
        height: 8px;
        left: 3vw;
        bottom: 2vw;
    }
}
.last-i {
    display: inline-block;
    position: relative;
    top: 20px;
    color: #eb1515;
}
@media (max-width: 600px) {
    .last-i {
        top: 3.5vw;
    }
}
</style>
</head>

<body>

<div class="logo">
    <div class="logo-text">Yumm<span class="last-i">i</span></div>
    <div class="underline"></div>
</div>
<script>
    setTimeout(() => {
        window.location.href = "home.html";
    }, 3000);
</script>
</body>
</html>
