
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yummi Logo</title>

<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    overflow-x: hidden;
}

/* LOGO + CHARACTER CONTAINER */

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 100%;
    padding: 10px;
}

/* LOGO */

.logo {
    position: relative;
    display: inline-block;
    flex-shrink: 0;
    padding: 20px 20px 50px;
}

.logo-text {
    font-family: 'Anton', sans-serif;
    font-size: clamp(65px, 15vw, 110px);
    color: black;
    font-weight: 1000;
    letter-spacing: 9px;
    position: relative;
    z-index: 2;
    white-space: nowrap;
    
}

/* INDIVIDUAL LETTERS */

.logo-text span {
    display: inline-block;
}

/* ONLY i MOVES DOWN */

.logo-text .letter-i {
    transform: translateY(9px);
}
.logo-text .letter-i {
    display: inline-block;
    transform: translateY(20px);
    color: red;
}

.logo .logo-text {
    display: inline-block !important;
    position: relative !important;
    rotate: -5deg !important;
    transform: none !important;
    transform-origin: center center !important;
}
/* SIGNATURE CURVE */

.logo::after {
    content: "";
    position: absolute;
    width: 82%;
    height: 90px;
    left: 12%;
    rotate: -5deg;
    bottom: -26px;
    border-top: 18px solid red; /* Line thickness increased */
    transform: none;
    pointer-events: none;
}
@media screen and (max-width: 600px) {
    .logo::after {
        content: "" !important;
        position: absolute !important;
        width: 82% !important;
        height: 90px !important;
        left: 12.5% !important;
        bottom: -28px !important;
        border-top: 11px solid red !important;
        transform: none !important;
        pointer-events: none !important;
        box-sizing: border-box !important;
    }
}
/* MOBILE */
@media screen and (max-width: 600px) {

    .logo-text .letter-i {
        display: inline-block;
        transform: translateY(13px);
    }

    .logo::after {
        width: 70%;
        left: 23%;
        bottom: 55px;
        border-top-width: 4px;
    }
}

/* CHARACTER */

.character {
    display: block;
    width: 75px;
    height: auto;
    max-height: 110px;
    object-fit: contain;
    flex-shrink: 0;
    margin-left: -30px;
}

/* MOBILE */

@media screen and (max-width: 600px) {

    .logo-container {
        gap: 0;
        padding: 5px;
    }

    .logo {
        padding: 15px 12px 45px;
    }

    .logo-text {
        font-size: clamp(52px, 16vw, 78px);
        letter-spacing: 4px;
    }

    .logo::after {
        width: 65%;
        height: 35px;
        left: 25%;
        bottom: 46px;
        border-top-width: 4px;
    }

    .character {
        width: 48px;
        max-height: 75px;
        margin-left: -15px;
    }
}

/* EXTRA SMALL MOBILE */

@media screen and (max-width: 360px) {

    .logo {
        padding: 12px 8px 40px;
    }

    .logo-text {
        font-size: 53px;
        letter-spacing: -3px;
    }

    .logo::after {
        bottom: 39px;
        height: 22px;
    }

    .character {
        width: 40px;
        max-height: 65px;
    }
}
</style>
</head>

<body>

<div class="logo-container">

    <div class="logo">
        <span class="logo-text"><span>Y</span><span>u</span><span>m</span><span>m</span><span class="letter-i">i</span></span>
    </div>

  <!--  <img
        class="character"
        src="yummi_char.webp"
        alt="Yummi mascot"
    >  -->

</div>

<script>
    setTimeout(() => {
        window.location.href = "home.html";
    }, 3000);
</script>

</body>
</html>
